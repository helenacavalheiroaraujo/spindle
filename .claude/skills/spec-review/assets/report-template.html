<title>Spindle Spec Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column — summary, filters, open findings first; questions, to-do, resolved and coverage below. Spindle palette: record-sleeve cream, ink navy, label brown. */
:root {
  --bg: #f4efe6;
  --surface: #fbf8f2;
  --ink: #1d2433;
  --ink-2: #4a5163;
  --muted: #6f6a60;
  --line: #e2dacb;
  --accent: #7a4b2a;
  --accent-soft: #efe3d4;
  --blocker: #b3261e;
  --blocker-bg: #fbe6e3;
  --high: #8a5a00;
  --high-bg: #fbefd6;
  --low: #4a5a6e;
  --low-bg: #e8ecf1;
  --ok: #2f6b3c;
  --ok-bg: #e3f0e4;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17191f; --surface: #1f222a; --ink: #ece6da; --ink-2: #c3bcae; --muted: #9a9384; --line: #343843;
    --accent: #d9a272; --accent-soft: #3a2e24;
    --blocker: #ff8a80; --blocker-bg: #3d1f1d; --high: #f2c36b; --high-bg: #3a2f17; --low: #a9b8ca; --low-bg: #262d37;
    --ok: #8fd19e; --ok-bg: #1f3324; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17191f; --surface: #1f222a; --ink: #ece6da; --ink-2: #c3bcae; --muted: #9a9384; --line: #343843;
  --accent: #d9a272; --accent-soft: #3a2e24;
  --blocker: #ff8a80; --blocker-bg: #3d1f1d; --high: #f2c36b; --high-bg: #3a2f17; --low: #a9b8ca; --low-bg: #262d37;
  --ok: #8fd19e; --ok-bg: #1f3324; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 32px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 36px; }
h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.05; }
h2 { font-size: 1.5rem; display: flex; align-items: baseline; gap: 10px; }
h2 .n { font-family: var(--mono); font-size: .9rem; color: var(--muted); font-weight: 400; }
.meta { color: var(--muted); font-size: .95rem; margin: 6px 0 0; }
.meta a { color: var(--accent); }
section { display: grid; gap: 14px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.tile b { font-family: var(--display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; }
.tile.blocker b { color: var(--blocker); } .tile.high b { color: var(--high); } .tile.low b { color: var(--low); } .tile.ok b { color: var(--ok); }
.bytype { color: var(--ink-2); font-size: .95rem; margin: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.filters label { display: grid; gap: 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.filters select { font: inherit; font-size: .95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 130px; }
.filters button { font: inherit; font-size: .95rem; color: var(--accent); background: none; border: 0; padding: 6px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
select:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.list { display: grid; gap: 12px; }
.f { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.f.sev-Blocker { border-left: 4px solid var(--blocker); border-radius: 0 10px 10px 0; }
.f-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.id { font-family: var(--mono); font-weight: 500; color: var(--accent); }
.f-title { font-weight: 600; font-size: 1.05rem; flex-basis: 100%; }
.chip { font-size: .78rem; font-weight: 600; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.chip.Blocker { background: var(--blocker-bg); color: var(--blocker); }
.chip.High { background: var(--high-bg); color: var(--high); }
.chip.Low { background: var(--low-bg); color: var(--low); }
.chip.type { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
.chip.st { background: var(--ok-bg); color: var(--ok); }
.stories { color: var(--muted); font-size: .9rem; }
.ev { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.ev li { font-size: .92rem; }
.ev .src { color: var(--muted); font-size: .82rem; display: block; }
.ev q { font-style: italic; color: var(--ink-2); }
.prop { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prop div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.prop h4, .q-h { margin: 0 0 4px; font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.qbox { background: var(--high-bg); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: .95rem; }
.res { font-size: .92rem; color: var(--ink-2); }
.empty { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 14px 16px; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.rows li { padding: 12px 16px; display: flex; gap: 12px; align-items: baseline; }
.rows li + li { border-top: 1px solid var(--line); }
.rows .id { flex: none; min-width: 2.6em; }
.rows .done { color: var(--muted); text-decoration: line-through; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary h2::before { content: "›"; display: inline-block; width: .7em; color: var(--muted); transition: transform .15s; }
details[open] > summary h2::before { transform: rotate(90deg); }
details > .list { margin-top: 14px; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.yes { color: var(--ok); } td.no { color: var(--blocker); font-weight: 600; } td.na { color: var(--muted); }
.legend { color: var(--muted); font-size: .85rem; margin: 0; }
@media (max-width: 640px) { .prop { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>Spindle spec review</h1>
    <p class="meta" id="meta"></p>
  </header>

  <section aria-labelledby="h-sum">
    <h2 id="h-sum">Summary</h2>
    <div class="tiles" id="tiles"></div>
    <p class="bytype" id="bytype"></p>
  </section>

  <div class="filters" role="group" aria-label="Filter findings">
    <label for="f-type">Type<select id="f-type"><option value="">All</option><option>Gap</option><option>Inconsistency</option><option>Ambiguity</option></select></label>
    <label for="f-sev">Severity<select id="f-sev"><option value="">All</option><option>Blocker</option><option>High</option><option>Low</option></select></label>
    <label for="f-story">Story<select id="f-story"><option value="">All</option></select></label>
    <label for="f-status">Status<select id="f-status"><option value="">All</option><option value="open">Open</option><option value="closed">Closed</option></select></label>
    <button type="button" id="f-clear">Clear filters</button>
  </div>

  <section aria-labelledby="h-open">
    <h2 id="h-open">Open findings <span class="n" id="c-open"></span></h2>
    <div class="list" id="open"></div>
  </section>

  <section aria-labelledby="h-q">
    <h2 id="h-q">Questions to close <span class="n" id="c-q"></span></h2>
    <ul class="rows" id="questions"></ul>
  </section>

  <section aria-labelledby="h-todo">
    <h2 id="h-todo">To-do <span class="n" id="c-todo"></span></h2>
    <ul class="rows" id="todo"></ul>
  </section>

  <details id="resolved-wrap">
    <summary><h2 id="h-res">Resolved <span class="n" id="c-res"></span></h2></summary>
    <div class="list" id="resolved"></div>
  </details>

  <section aria-labelledby="h-cov">
    <h2 id="h-cov">Coverage</h2>
    <p class="legend">Template sections present in each story, and which checks were run. ✓ present / done · ✗ missing · – not applicable</p>
    <div class="tablewrap"><table id="coverage"></table></div>
  </section>
</div>

<script>
const DATA = /*__DATA__*/null;
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  if (!DATA) { $("meta").textContent = "No register data was built into this page."; return; }
  const F = DATA.findings || [];
  const SEV_ORDER = { Blocker: 0, High: 1, Low: 2 };
  const isOpen = (f) => f.status === "open";
  const STATUS_LABEL = { resolved: "Resolved", "wont-fix": "Won't fix", "new-story": "Moved to new story", open: "Open" };

  const m = DATA.meta || {};
  const upd = m.updated ? new Date(m.updated) : null;
  $("meta").innerHTML = [m.project, "Iteration " + (m.iteration ?? "—"), upd && !isNaN(upd) ? "Updated " + upd.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : ""].filter(Boolean).map(esc).join(" · ");

  const open = F.filter(isOpen), closed = F.filter((f) => !isOpen(f));
  const cnt = (arr, k, v) => arr.filter((f) => f[k] === v).length;
  $("tiles").innerHTML = [
    ["blocker", cnt(open, "severity", "Blocker"), "Blockers"],
    ["high", cnt(open, "severity", "High"), "High"],
    ["low", cnt(open, "severity", "Low"), "Low"],
    ["ok", closed.length, "Closed"],
  ].map(([c, n, l]) => `<div class="tile ${c}"><b>${n}</b><span>${l}</span></div>`).join("");
  $("bytype").textContent = `Open by type: ${cnt(open, "type", "Gap")} gaps · ${cnt(open, "type", "Inconsistency")} inconsistencies · ${cnt(open, "type", "Ambiguity")} ambiguities`;

  const stories = [...new Set(F.flatMap((f) => f.stories || []))].sort((a, b) => (a === "all" ? -1 : b === "all" ? 1 : Number(a) - Number(b)));
  $("f-story").insertAdjacentHTML("beforeend", stories.map((s) => `<option value="${esc(s)}">${s === "all" ? "All stories" : "Story " + esc(s)}</option>`).join(""));

  const card = (f) => {
    const ev = (f.evidence || []).map((e) => `<li><span class="src">${esc(e.source)} · ${esc(e.where)}</span><q>${esc(e.quote)}</q></li>`).join("");
    const p = f.proposal;
    const prop = p ? `<div class="prop"><div><h4>Current${p.section ? " · " + esc(p.section) : ""}</h4>${esc(p.current || "(nothing)")}</div><div><h4>Proposed</h4>${esc(p.proposed)}</div></div>` : "";
    const q = f.question ? `<div class="qbox"><p class="q-h">Decision needed</p>${esc(f.question)}</div>` : "";
    const r = f.resolution ? `<p class="res"><strong>${esc(STATUS_LABEL[f.status] || f.status)}</strong> in iteration ${esc(f.resolution.iteration)} — ${esc(f.resolution.decision)}</p>` : "";
    const st = (f.stories || []).map((s) => (s === "all" ? "All stories" : "Story " + s)).join(", ");
    return `<article class="f sev-${esc(f.severity)}">
      <div class="f-head"><span class="id">#${esc(f.id)}</span><span class="chip ${esc(f.severity)}">${esc(f.severity)}</span><span class="chip type">${esc(f.type)}</span>${!isOpen(f) ? `<span class="chip st">${esc(STATUS_LABEL[f.status])}</span>` : ""}<span class="stories">${esc(st)}</span>
      <span class="f-title">${esc(f.title)}</span></div>
      <ul class="ev">${ev}</ul>${q}${prop}${r}</article>`;
  };

  function render() {
    const t = $("f-type").value, s = $("f-sev").value, so = $("f-story").value, stt = $("f-status").value;
    const pass = (f) => (!t || f.type === t) && (!s || f.severity === s) && (!so || (f.stories || []).includes(so) || (f.stories || []).includes("all"));
    const sort = (a, b) => SEV_ORDER[a.severity] - SEV_ORDER[b.severity] || a.id - b.id;
    const o = stt === "closed" ? [] : open.filter(pass).sort(sort);
    const c = stt === "open" ? [] : closed.filter(pass).sort((a, b) => a.id - b.id);
    $("open").innerHTML = o.length ? o.map(card).join("") : `<p class="empty">${open.length ? "No open findings match these filters." : "No open findings."}</p>`;
    $("resolved").innerHTML = c.length ? c.map(card).join("") : `<p class="empty">${closed.length ? "No closed findings match these filters." : "Nothing closed yet."}</p>`;
    $("c-open").textContent = o.length + (o.length !== open.length ? " of " + open.length : "");
    $("c-res").textContent = c.length + (c.length !== closed.length ? " of " + closed.length : "");
  }
  ["f-type", "f-sev", "f-story", "f-status"].forEach((id) => $(id).addEventListener("change", render));
  $("f-clear").addEventListener("click", () => { ["f-type", "f-sev", "f-story", "f-status"].forEach((id) => ($(id).value = "")); render(); });
  render();

  const Q = DATA.questions || [];
  const qo = Q.filter((q) => q.status === "open");
  $("c-q").textContent = qo.length;
  $("questions").innerHTML = Q.length ? Q.map((q) => `<li><span class="id">${esc(q.id)}</span><span class="${q.status === "open" ? "" : "done"}">${esc(q.question)}${q.finding ? ` <span class="stories">(#${esc(q.finding)})</span>` : ""}${q.answer ? ` — <em>${esc(q.answer)}</em>` : ""}</span></li>`).join("") : `<li class="empty">No questions.</li>`;

  const T = DATA.todo || [];
  $("c-todo").textContent = T.filter((x) => !x.done).length;
  $("todo").innerHTML = T.length ? T.map((x) => `<li><span class="id">${esc(x.id)}</span><span class="${x.done ? "done" : ""}">${esc(x.text)}${x.finding ? ` <span class="stories">(#${esc(x.finding)})</span>` : ""}</span></li>`).join("") : `<li class="empty">Nothing to do.</li>`;

  const C = DATA.coverage || [];
  const mark = (v) => v === true || v === "done" ? `<td class="yes">✓</td>` : v === false ? `<td class="no">✗</td>` : v === "n/a" ? `<td class="na">–</td>` : `<td class="na">${esc(v ?? "–")}</td>`;
  const openFor = (s) => open.filter((f) => (f.stories || []).includes(s) || (f.stories || []).includes("all")).length;
  $("coverage").innerHTML = `<thead><tr><th>Story</th><th>Tested</th><th>Story sentence</th><th>Scope</th><th>Pre-condition</th><th>Criteria</th><th>Criteria check</th><th>States</th><th>Data</th><th>Design</th><th>Open</th></tr></thead><tbody>` +
    C.map((c) => `<tr><td>${esc(c.story)} · ${esc(c.title)}</td>${c.tested ? `<td class="yes">Yes</td>` : `<td class="na">No</td>`}${mark(c.template?.story)}${mark(c.template?.scope)}${mark(c.template?.precondition)}${mark(c.template?.criteria)}${mark(c.checks?.criteria)}${mark(c.checks?.states)}${mark(c.checks?.data)}${mark(c.checks?.design)}<td>${openFor(String(c.story))}</td></tr>`).join("") + `</tbody>`;
})();
</script>
