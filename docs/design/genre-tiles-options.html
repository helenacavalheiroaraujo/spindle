<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genre crate options</title>
<!-- Home page crate row · three options for genre crates that show the style of each genre. Proposal for approval; not built.
     Same size and place as today (components/Crate.tsx): name and record count at the bottom left. Counts are examples. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Inter:wght@400;600&family=Cormorant+Garamond:ital,wght@1,600&family=Space+Mono:wght@700&family=Abril+Fatface&family=Bungee&family=Josefin+Sans:wght@600&family=Anton&family=Shrikhand&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,sans-serif;background:#f4efe6;color:#1d2433;font-size:15px;line-height:1.4;padding:24px 16px}
.hd{font-family:'Barlow Condensed',sans-serif;font-weight:600}
.wrap{max-width:1232px;margin:0 auto}
.intro{margin-bottom:24px}.intro h1{font-size:40px;line-height:1}.intro p{margin-top:6px;color:#4a4f5c;max-width:760px}
.frame{border:1px solid #1d2433;border-radius:20px;padding:24px;margin-bottom:32px;background:#f4efe6}
.frame h2{font-size:30px;line-height:1}
.frame .what{margin-top:4px;color:#4a4f5c}
.trade{display:grid;gap:8px;margin:14px 0 18px;grid-template-columns:1fr}
.trade div{background:#f1e6d0;border:1px solid #e2dacb;border-radius:14px;padding:10px 14px;font-size:14px}
.trade b{display:block;font-weight:600;margin-bottom:2px}
.sub{font-size:13px;font-weight:600;margin:6px 0 10px;color:#4a4f5c}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.phone{width:375px;max-width:100%;border:1px solid #c8bfae;border-radius:28px;padding:20px 16px;margin-top:22px;background:#f4efe6}
.phone .row{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none}
.phone .row::-webkit-scrollbar{display:none}
.phone .row>*{flex:0 0 42%}
.phone h3{font-size:26px;margin-bottom:10px}
.illus{font-size:12px;color:#6f6a60;margin-top:8px}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.trade{grid-template-columns:repeat(3,1fr)}}

/* the crate */
.t{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden}
.t svg.art{position:absolute;inset:0;width:100%;height:100%}
.t .lab{position:absolute;left:12px;right:12px;bottom:12px;z-index:2}
.t .nm{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:600;line-height:1;font-size:24px}
.t .ct{display:block;margin-top:4px;font-size:12px}
.phone .t .nm{font-size:20px}
.phone .t .lab{left:10px;bottom:10px}
@media (min-width:900px){.grid .t .lab{left:16px;bottom:16px}}
</style></head><body>
<div class="wrap">
  <header class="intro">
    <h1 class="hd">Genre crates: options</h1>
    <p>Each crate should show the style of its genre at a glance. Same size and place as today; name and number of records stay at the bottom left. Proposal for approval; not built. Counts are examples.</p>
  </header>
  <div id="options"></div>
</div>

<script>
const G = [
  {slug:"classical", name:"Classical", n:8,  color:"#d8cdb6", ink:"#1d2433"},
  {slug:"electronic",name:"Electronic",n:2,  color:"#d6c6a4", ink:"#1d2433"},
  {slug:"fado",      name:"Fado",      n:1,  color:"#3a2a1f", ink:"#f4efe6"},
  {slug:"hip-hop",   name:"Hip-hop",   n:1,  color:"#74644f", ink:"#f4efe6"},
  {slug:"jazz",      name:"Jazz",      n:1,  color:"#1f2a44", ink:"#f4efe6"},
  {slug:"rock",      name:"Rock",      n:15, color:"#c6a26b", ink:"#1d2433"},
  {slug:"soul-and-funk",name:"Soul and funk",n:2,color:"#a98c5f",ink:"#1d2433"},
];
let uid = 0;
const recs = n => `${n} ${n===1?"record":"records"}`;

/* ---------- Option A: the genre's instrument, line drawing ---------- */
function artA(g){
  const s = g.ink, f = g.color;
  const L = `fill="none" stroke="${s}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"`;
  switch(g.slug){
    case "classical": return `<g transform="translate(70 30) rotate(32) scale(.82) translate(0 -14)" ${L}>
      <path d="M0,4 C6,4 9,7 9,12 C9,16 6,18 5,22 C5,25 6,27 9,29 C12,32 12,40 9,44 C6,47 2,48 0,48 C-2,48 -6,47 -9,44 C-12,40 -12,32 -9,29 C-6,27 -5,25 -5,22 C-6,18 -9,16 -9,12 C-9,7 -6,4 0,4 Z"/>
      <rect x="-2" y="-14" width="4" height="18" rx="1"/><circle cx="0" cy="-17.5" r="3"/>
      <path d="M-4.6,22 c-1.6,3 1.6,7 0,10 M4.6,22 c1.6,3 -1.6,7 0,10"/><path d="M-3.8,35 H3.8"/>
      <path d="M-1,-12 V38 M1,-12 V38" stroke-width="1"/><path d="M-2.2,38 H2.2 L1.2,45 H-1.2 Z"/></g>`;
    case "electronic": {
      const on = new Set(["0,0","2,0","1,1","3,1","0,2","2,2","1,3","3,3"]);
      let pads = "";
      for(let r=0;r<4;r++)for(let c=0;c<4;c++){const x=54+c*11,y=20+r*10;pads+=`<rect x="${x}" y="${y}" width="8" height="7" rx="1.6" ${on.has(c+","+r)?`fill="${s}"`:""}/>`;}
      return `<g transform="translate(18 2) scale(.8)" ${L}><rect x="49" y="5" width="50" height="62" rx="5"/>${pads}
        <circle cx="58" cy="12" r="3"/><circle cx="69" cy="12" r="3"/><circle cx="80" cy="12" r="3"/>
        <path d="M58,12 L58,9.6 M69,12 L71,10.4 M80,12 L78,10" stroke-width="1.6"/><rect x="87" y="9.5" width="8" height="5" rx="1"/></g>`;
    }
    case "fado": {
      let pegs=""; for(let i=0;i<6;i++){const a=Math.PI*(1+ (i+.5)/6);pegs+=`<circle cx="${(Math.cos(a)*9).toFixed(2)}" cy="${(-14+Math.sin(a)*9).toFixed(2)}" r="1.4" fill="${s}" stroke="none"/>`;}
      return `<g transform="translate(70 30) rotate(-24) scale(.8) translate(0 -16)" ${L}>
        <path d="M0,12 C10,12 16,22 16,31 C16,41 9,47 0,47 C-9,47 -16,41 -16,31 C-16,22 -10,12 0,12 Z"/>
        <circle cx="0" cy="27" r="4.5"/><circle cx="0" cy="27" r="6.6" stroke-width="1"/><path d="M-5,39 H5"/>
        <rect x="-2.5" y="-8" width="5" height="20" rx="1"/>
        <path d="M-9,-14 A9,9 0 0 1 9,-14 L2.5,-8 H-2.5 Z"/>${pegs}
        <path d="M-1.2,-8 V39 M0,-8 V39 M1.2,-8 V39" stroke-width=".7"/></g>`;
    }
    case "hip-hop": return `<g transform="rotate(-8 72 32)" ${L}>
      <path d="M56,20 V12 H86 V20"/><path d="M86,12 L96,2"/>
      <rect x="47" y="20" width="48" height="30" rx="4"/>
      <circle cx="58" cy="37" r="7.5"/><circle cx="58" cy="37" r="2.6" fill="${s}"/>
      <circle cx="84" cy="37" r="7.5"/><circle cx="84" cy="37" r="2.6" fill="${s}"/>
      <rect x="66" y="29" width="10" height="8" rx="1.2"/><circle cx="69" cy="33" r="1" fill="${s}"/><circle cx="73" cy="33" r="1" fill="${s}"/>
      <path d="M66,43 H76" /><path d="M52,24 H62 M80,24 H90" stroke-width="1.4"/></g>`;
    case "jazz": return `<g transform="translate(-4 2)">
      <path d="M58,11 C62,7 68,9 70,14 L75,42 C77,53 89,55 91,44 L93,33" fill="none" stroke="${s}" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M58,11 C62,7 68,9 70,14 L75,42 C77,53 89,55 91,44 L93,33" fill="none" stroke="${f}" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M89,38 L86,29 M97,37 L101,28" ${L}/><ellipse cx="93.5" cy="28" rx="7.6" ry="2.8" transform="rotate(-6 93.5 28)" ${L}/>
      <path d="M52,12.5 L58,11" stroke="${s}" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="71.6" cy="22" r="1.8" fill="${s}"/><circle cx="72.8" cy="28.5" r="1.8" fill="${s}"/><circle cx="74" cy="35" r="1.8" fill="${s}"/>
      <path d="M79,47 l-5,2" ${L} stroke-width="1.6"/></g>`;
    case "rock": return `<g transform="translate(70 30) rotate(30) scale(.72) translate(0 -6)" ${L}>
      <path d="M0,10 L-15,46 L-8.5,48 L0,31 L8.5,48 L15,46 Z"/>
      <rect x="-2" y="-24" width="4" height="34" rx=".8"/><path d="M-2.4,-24 L-4,-34 H3.4 L2.4,-24 Z"/>
      <rect x="-4.5" y="15" width="9" height="3" rx=".8"/><rect x="-4.5" y="21" width="9" height="3" rx=".8"/>
      <path d="M-1,-30 V26 M1,-30 V26" stroke-width=".8"/><circle cx="7" cy="36" r="1.3" fill="${s}"/></g>`;
    case "soul-and-funk": return `<g ${L}><defs><clipPath id="mic${uid}"><rect x="61" y="6" width="22" height="32" rx="11"/></clipPath></defs>
      <rect x="61" y="6" width="22" height="32" rx="11"/>
      <g clip-path="url(#mic${uid})" stroke-width="1.5"><path d="M60,13 H84 M60,18 H84 M60,23 H84 M60,28 H84 M60,33 H84"/></g>
      <path d="M72,6 V38" stroke-width="1.5"/>
      <path d="M57,22 C57,40 87,40 87,22"/><path d="M72,37 V54"/><path d="M63,56 H81"/></g>`;
  }
}

/* ---------- Option B: a pattern from the genre's visual world ---------- */
function artB(g){
  const s = g.ink, id = "b"+(uid++);
  const fade = `<defs><linearGradient id="${id}g" x1="1" y1="0" x2="0" y2="1"><stop offset=".25" stop-color="#fff"/><stop offset=".85" stop-color="#000"/></linearGradient>
     <mask id="${id}m"><rect width="100" height="100" fill="url(#${id}g)"/></mask></defs>`;
  switch(g.slug){
    case "classical": {
      let st=""; for(let i=0;i<5;i++){const y=14+i*4.2;st+=`<path d="M-2,${y+6} C25,${y-4} 55,${y+12} 104,${y-2}"/>`;}
      return `${fade}<g mask="url(#${id}m)" fill="none" stroke="${s}" stroke-width="1" opacity=".75">${st}</g>
        <g fill="${s}" stroke="${s}" stroke-width="1.3"><ellipse cx="58" cy="24.5" rx="2.7" ry="2" transform="rotate(-20 58 24.5)"/><path d="M60.4,24 V12"/>
        <ellipse cx="70" cy="20" rx="2.7" ry="2" transform="rotate(-20 70 20)"/><path d="M72.4,19.5 V7.5"/><path d="M60.4,12 L72.4,7.5" stroke-width="2.2"/>
        <ellipse cx="84" cy="27" rx="2.7" ry="2" transform="rotate(-20 84 27)"/><path d="M86.4,26.5 V14.5"/><path d="M86.4,14.5 c3,2 4,5 2,8" fill="none"/></g>`;
    }
    case "electronic": return `${fade}<defs><pattern id="${id}p" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r=".55" fill="${s}"/></pattern></defs>
      <rect width="100" height="100" fill="url(#${id}p)" mask="url(#${id}m)" opacity=".5"/>
      <g fill="none" stroke="${s}" stroke-width="1.8" stroke-linejoin="round" mask="url(#${id}m)">
      <path d="M0,22 C6,10 12,10 18,22 S30,34 36,22 S48,10 54,22 S66,34 72,22 S84,10 90,22 S102,34 108,22"/>
      <path d="M0,42 H9 V32 H21 V42 H33 V32 H45 V42 H57 V32 H69 V42 H81 V32 H93 V42 H104"/>
      <path d="M0,58 L12,48 L24,58 L36,48 L48,58 L60,48 L72,58 L84,48 L96,58 L108,48"/></g>`;
    case "fado": return `${fade}<defs><pattern id="${id}p" width="20" height="20" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="${s}" stroke-width=".9"><rect x="0" y="0" width="20" height="20"/>
        <path d="M10,2 L18,10 L10,18 L2,10 Z"/><circle cx="10" cy="10" r="3"/>
        <path d="M0,5 A5,5 0 0 0 5,0 M15,0 A5,5 0 0 0 20,5 M20,15 A5,5 0 0 0 15,20 M5,20 A5,5 0 0 0 0,15"/>
        <path d="M10,7 V2 M10,13 V18 M7,10 H2 M13,10 H18" stroke-width=".6"/></g><circle cx="10" cy="10" r="1" fill="${s}"/></pattern></defs>
      <rect width="100" height="100" fill="url(#${id}p)" mask="url(#${id}m)" opacity=".8"/>`;
    case "hip-hop": return `${fade}<defs><pattern id="${id}p" width="20" height="10" patternUnits="userSpaceOnUse">
        <path d="M0,0 H20 M0,5 H20 M5,0 V5 M15,5 V10" fill="none" stroke="${s}" stroke-width=".7"/></pattern></defs>
      <rect width="100" height="100" fill="url(#${id}p)" mask="url(#${id}m)" opacity=".55"/>
      <g fill="none" stroke="${s}" stroke-linecap="round" stroke-linejoin="round">
        <path d="M44,26 C52,14 60,30 68,18 S84,22 92,12" stroke-width="5"/>
        <path d="M52,22 V33 M67,20 V38 M83,18 V29" stroke-width="2"/></g>
      <g fill="${s}"><circle cx="52" cy="34.5" r="1.6"/><circle cx="67" cy="39.5" r="1.6"/><circle cx="83" cy="30.5" r="1.6"/></g>`;
    case "jazz": return `<g fill="${s}">
        <circle cx="78" cy="22" r="16" opacity=".9"/>
        <rect x="46" y="14" width="5" height="34"/><rect x="54" y="24" width="5" height="24"/><rect x="62" y="34" width="5" height="14"/>
        <rect x="70" y="44" width="28" height="4"/></g>
      <circle cx="78" cy="22" r="6" fill="${g.color}"/><circle cx="94" cy="56" r="2.5" fill="${s}"/><circle cx="86" cy="58" r="1.5" fill="${s}"/>`;
    case "rock": return `<g fill="${s}">
        <path d="M70,0 L52,34 H64 L54,62 L88,22 H74 L86,0 Z"/></g>
      <g stroke="${s}" stroke-width="2.4" stroke-linecap="round"><path d="M92,30 L100,26 M90,38 L100,34 M86,46 L98,42"/></g>`;
    case "soul-and-funk": {
      const cols=["#5a3a24","#c8923a","#f4efe6","#1d2433","#5a3a24"]; let a="";
      cols.forEach((c,i)=>{const r=62-i*9;a+=`<circle cx="100" cy="0" r="${r}" fill="${c}"/>`;});
      return a+`<circle cx="100" cy="0" r="17" fill="${g.color}"/>`;
    }
  }
}


/* ---------- Option B2: sober patterns, tone on tone, one thin line weight ---------- */
function artB2(g){
  const s = g.ink, id = "s"+(uid++), O = g.ink==="#f4efe6" ? .4 : .32;
  const fade = `<defs><linearGradient id="${id}g" x1="1" y1="0" x2="0" y2="1"><stop offset=".2" stop-color="#fff"/><stop offset=".8" stop-color="#000"/></linearGradient>
     <mask id="${id}m"><rect width="100" height="100" fill="url(#${id}g)"/></mask></defs>`;
  const wrap = inner => `${fade}<g mask="url(#${id}m)" opacity="${O}" fill="none" stroke="${s}" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round">${inner}</g>`;
  switch(g.slug){
    case "classical": { let st=""; [8,40].forEach(y0=>{for(let i=0;i<5;i++){const y=y0+i*3.4;st+=`<path d="M-2,${y+6} C25,${y-5} 60,${y+13} 104,${y-3}"/>`;}}); return wrap(st); }
    case "electronic": { let w=""; for(let k=0;k<7;k++){const y=6+k*8,step=4+k%3*2;let d=`M0,${y}`;for(let x=0;x<=104;x+=step){const up=(x/step)%2?-3:0;d+=` H${x} V${y+up}`;}w+=`<path d="${d}"/>`;} return wrap(w); }
    case "fado": return `${fade}<defs><pattern id="${id}p" width="20" height="20" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="${s}" stroke-width=".6"><rect x="0" y="0" width="20" height="20"/><path d="M10,2 L18,10 L10,18 L2,10 Z"/><circle cx="10" cy="10" r="3"/>
        <path d="M0,5 A5,5 0 0 0 5,0 M15,0 A5,5 0 0 0 20,5 M20,15 A5,5 0 0 0 15,20 M5,20 A5,5 0 0 0 0,15"/></g></pattern></defs>
        <rect width="100" height="100" fill="url(#${id}p)" mask="url(#${id}m)" opacity="${O}"/>`;
    case "hip-hop": { let b=""; for(let r=0;r<12;r++){const y=r*6;b+=`<path d="M0,${y} H100"/>`;for(let x=(r%2?0:7);x<100;x+=14)b+=`<path d="M${x},${y} V${y+6}"/>`;} return wrap(b); }
    case "jazz": return wrap(`<circle cx="76" cy="24" r="16"/><circle cx="76" cy="24" r="6"/><path d="M46,12 V48 M53,22 V48 M60,32 V48 M46,48 H98"/><circle cx="92" cy="56" r="2"/>`);
    case "rock": { let z=""; for(let k=-6;k<10;k++){let d="";for(let i=0;i<12;i++){const x=i*9,y=k*7+i*3;d+=(i?" L":"M")+`${x},${y+(i%2?5:0)}`;}z+=`<path d="${d}"/>`;} return wrap(z); }
    case "soul-and-funk": { let a=""; for(let r=12;r<=76;r+=6)a+=`<circle cx="100" cy="0" r="${r}"/>`; return wrap(a); }
  }
}


/* ---------- B variations: same subjects as B, three drawing styles ---------- */
function fadeDefs(id, a=.25, b=.85){return `<defs><linearGradient id="${id}g" x1="1" y1="0" x2="0" y2="1"><stop offset="${a}" stop-color="#fff"/><stop offset="${b}" stop-color="#000"/></linearGradient><mask id="${id}m"><rect width="100" height="100" fill="url(#${id}g)"/></mask></defs>`;}
const accentOf = g => g.ink==="#f4efe6" ? "#c8923a" : "#5a3a24";

/* B·1 Fine line: one thin, sharp line weight; no rounded blobs */
function artV1(g){
  const s=g.ink, f=g.color, id="v"+(uid++), F=fadeDefs(id);
  const L=`fill="none" stroke="${s}" stroke-width="1.1" stroke-linecap="butt" stroke-linejoin="miter"`;
  switch(g.slug){
    case "classical": { let st=""; for(let i=0;i<5;i++){const y=16+i*4;st+=`<path d="M-2,${y+5} C30,${y-3} 60,${y+9} 104,${y-1}"/>`;}
      return `${F}<g mask="url(#${id}m)" ${L} stroke-width=".7">${st}</g>
      <g fill="${s}"><ellipse cx="60" cy="23.6" rx="2.1" ry="1.5" transform="rotate(-20 60 23.6)"/><ellipse cx="71" cy="21.4" rx="2.1" ry="1.5" transform="rotate(-20 71 21.4)"/><ellipse cx="85" cy="27.2" rx="2.1" ry="1.5" transform="rotate(-20 85 27.2)"/></g>
      <g ${L} stroke-width=".9"><path d="M61.9,23 V11 M72.9,20.8 V8.8 M86.9,26.6 V14.6"/><path d="M61.9,11 L72.9,8.8" stroke-width="1.4"/><path d="M86.9,14.6 l3.5,3"/></g>`; }
    case "electronic": return `${F}<g mask="url(#${id}m)" ${L}>
      <path d="M0,22 C6,12 12,12 18,22 S30,32 36,22 S48,12 54,22 S66,32 72,22 S84,12 90,22 S102,32 108,22"/>
      <path d="M0,40 H9 V32 H21 V40 H33 V32 H45 V40 H57 V32 H69 V40 H81 V32 H93 V40 H104"/>
      <path d="M0,56 L12,48 L24,56 L36,48 L48,56 L60,48 L72,56 L84,48 L96,56 L108,48"/></g>`;
    case "fado": return `${F}<defs><pattern id="${id}p" width="20" height="20" patternUnits="userSpaceOnUse"><g fill="none" stroke="${s}" stroke-width=".7">
      <rect width="20" height="20"/><path d="M10,2 L18,10 L10,18 L2,10 Z"/><circle cx="10" cy="10" r="3"/><path d="M0,5 A5,5 0 0 0 5,0 M15,0 A5,5 0 0 0 20,5 M20,15 A5,5 0 0 0 15,20 M5,20 A5,5 0 0 0 0,15"/></g></pattern></defs>
      <rect width="100" height="100" fill="url(#${id}p)" mask="url(#${id}m)" opacity=".85"/>`;
    case "hip-hop": return `${F}<defs><pattern id="${id}p" width="20" height="10" patternUnits="userSpaceOnUse"><path d="M0,0 H20 M0,5 H20 M5,0 V5 M15,5 V10" fill="none" stroke="${s}" stroke-width=".5"/></pattern></defs>
      <rect width="100" height="100" fill="url(#${id}p)" mask="url(#${id}m)" opacity=".55"/>
      <path d="M42,24 C47,18 52,26 57,21 C62,16 66,25 72,19 C78,13 82,22 88,15 L95,10" fill="none" stroke="${s}" stroke-width="2.4" stroke-linecap="butt"/>
      <g stroke="${s}" stroke-width=".9"><path d="M50,22 V40 M63,20 V46 M79,17 V33 M88,15 V26"/></g>
      <g fill="${s}"><rect x="49.4" y="40" width="1.2" height="1.8"/><rect x="62.4" y="46" width="1.2" height="1.8"/><rect x="78.4" y="33" width="1.2" height="1.8"/></g>`;
    case "jazz": return `<g ${L}><circle cx="78" cy="22" r="16"/><circle cx="78" cy="22" r="6"/></g><g fill="${s}"><rect x="46" y="14" width="3" height="34"/><rect x="54" y="24" width="3" height="24"/><rect x="62" y="34" width="3" height="14"/><rect x="46" y="47" width="52" height="1.1"/><circle cx="94" cy="56" r="1.6"/></g>`;
    case "rock": return `<g ${L} stroke-width="1.3"><path d="M72,2 L54,34 H66 L56,62 L88,24 H75 L88,2 Z"/><path d="M79,2 L63,30 H74" stroke-width=".7"/></g>`;
    case "soul-and-funk": { let a=""; [62,53,44,35,26].forEach((r,i)=>{a+=`<circle cx="100" cy="0" r="${r}" fill="none" stroke="${s}" stroke-width="${i%2?1:3.2}"/>`;}); return a; }
  }
}

/* B·2 Screen print: flat solid shapes in two inks, printed slightly off register */
function artV2(g){
  const s=g.ink, f=g.color, a=accentOf(g);
  const two = shape => `<g transform="translate(2 2)" fill="${a}" stroke="${a}">${shape}</g><g fill="${s}" stroke="${s}">${shape}</g>`;
  switch(g.slug){
    case "classical": { let st=""; for(let i=0;i<5;i++){const y=14+i*4.4;st+=`<rect x="34" y="${y}" width="70" height="1" stroke="none"/>`;}
      return two(st+`<ellipse cx="58" cy="27.4" rx="3.4" ry="2.5" transform="rotate(-20 58 27.4)" stroke="none"/><rect x="60.6" y="10" width="1.6" height="17" stroke="none"/><ellipse cx="74" cy="23" rx="3.4" ry="2.5" transform="rotate(-20 74 23)" stroke="none"/><rect x="76.6" y="6" width="1.6" height="17" stroke="none"/><path d="M60.6,10 L78.2,6 V9.4 L60.6,13.4 Z" stroke="none"/>`); }
    case "electronic": return two([18,30,12,38,24,44,20,34,14].map((h,i)=>`<rect x="${48+i*5.6}" y="${52-h}" width="3.8" height="${h}" stroke="none"/>`).join(""));
    case "fado": return `<g transform="translate(76 26)">${two(`<path d="M0,-20 C6,-8 8,-6 20,0 C8,6 6,8 0,20 C-6,8 -8,6 -20,0 C-8,-6 -6,-8 0,-20 Z" stroke="none"/>`)}<circle r="5" fill="${f}"/><circle r="2.2" fill="${a}"/></g>
      <g fill="none" stroke="${s}" stroke-width="1"><rect x="52" y="2" width="48" height="48"/></g>`;
    case "hip-hop": return two(`<path fill-rule="evenodd" stroke="none" d="M46,14 H96 V46 H46 Z M52,20 V32 H90 V20 Z M58,40 L62,46 H80 L84,40 Z"/><circle cx="61" cy="26" r="3.6" stroke="none"/><circle cx="81" cy="26" r="3.6" stroke="none"/>`)+`<circle cx="61" cy="26" r="1.5" fill="${f}"/><circle cx="81" cy="26" r="1.5" fill="${f}"/>`;
    case "jazz": return `<circle cx="80" cy="22" r="16" fill="${a}"/><g fill="${s}"><rect x="46" y="14" width="5" height="34"/><rect x="54" y="24" width="5" height="24"/><rect x="62" y="34" width="5" height="14"/><rect x="66" y="44" width="32" height="4"/></g><circle cx="80" cy="22" r="5" fill="${f}"/>`;
    case "rock": return two(`<path d="M70,0 L52,34 H64 L54,62 L88,22 H74 L86,0 Z" stroke="none"/>`);
    case "soul-and-funk": { const cols=["#5a3a24","#c8923a","#f4efe6","#1d2433","#5a3a24"]; let r=""; cols.forEach((c,i)=>{r+=`<circle cx="100" cy="0" r="${62-i*9}" fill="${c}"/>`;}); return r+`<circle cx="100" cy="0" r="17" fill="${f}"/>`; }
  }
}

/* B·3 Big crop: one part of the subject, very large, cut by the edge of the crate */
function artV3(g){
  const s=g.ink, f=g.color, id="w"+(uid++), F=fadeDefs(id,.3,.75);
  switch(g.slug){
    case "classical": { let st=""; for(let i=0;i<5;i++){st+=`<rect x="0" y="${2+i*9}" width="100" height="1.4"/>`;}
      return `${F}<g mask="url(#${id}m)" fill="${s}">${st}<ellipse cx="66" cy="33" rx="8" ry="5.8" transform="rotate(-20 66 33)"/><rect x="72" y="-4" width="2.6" height="36"/><ellipse cx="94" cy="24" rx="8" ry="5.8" transform="rotate(-20 94 24)"/></g>`; }
    case "electronic": return `${F}<g mask="url(#${id}m)" fill="none" stroke="${s}" stroke-width="3"><path d="M-4,30 C10,-6 26,-6 40,30 S70,66 84,30 S104,-6 118,30"/></g>`;
    case "fado": return `${F}<defs><pattern id="${id}p" width="50" height="50" patternUnits="userSpaceOnUse" x="0" y="-10"><g fill="none" stroke="${s}" stroke-width="1.6">
      <rect width="50" height="50"/><path d="M25,5 L45,25 L25,45 L5,25 Z"/><circle cx="25" cy="25" r="7"/><path d="M0,12 A12,12 0 0 0 12,0 M38,0 A12,12 0 0 0 50,12 M50,38 A12,12 0 0 0 38,50 M12,50 A12,12 0 0 0 0,38"/></g><circle cx="25" cy="25" r="2.4" fill="${s}"/></pattern></defs>
      <rect width="100" height="100" fill="url(#${id}p)" mask="url(#${id}m)"/>`;
    case "hip-hop": return `${F}<defs><pattern id="${id}p" width="44" height="22" patternUnits="userSpaceOnUse"><path d="M0,0 H44 M0,11 H44 M11,0 V11 M33,11 V22" fill="none" stroke="${s}" stroke-width="1.1"/></pattern></defs>
      <rect width="100" height="100" fill="url(#${id}p)" mask="url(#${id}m)" opacity=".7"/>
      <g mask="url(#${id}m)"><path d="M30,20 C45,6 60,28 75,12 S95,8 110,2" fill="none" stroke="${s}" stroke-width="6"/><g stroke="${s}" stroke-width="1.6"><path d="M44,13 V44 M70,16 V54 M88,8 V30"/></g></g>`;
    case "jazz": return `<circle cx="92" cy="8" r="38" fill="${s}"/><circle cx="92" cy="8" r="13" fill="${f}"/><rect x="38" y="0" width="8" height="58" fill="${s}"/>`;
    case "rock": return `<path d="M76,-10 L44,48 H66 L48,100 L120,18 H90 L110,-10 Z" fill="${s}"/>`;
    case "soul-and-funk": { const cols=["#5a3a24","#c8923a","#f4efe6","#1d2433","#5a3a24","#c8923a"]; let r=""; cols.forEach((c,i)=>{r+=`<circle cx="104" cy="-4" r="${82-i*11}" fill="${c}"/>`;}); return `${F}<g mask="url(#${id}m)">${r}<circle cx="104" cy="-4" r="16" fill="${f}"/></g>`; }
  }
}

/* ---------- Option C: each genre with its own colours and lettering ---------- */
const C = {
  "classical":    {bg:"#f3ead8", ink:"#6b1f2a", font:"'Cormorant Garamond',serif", style:"italic", w:600, d:30, p:24, tr:"0"},
  "electronic":   {bg:"#111418", ink:"#b6f24a", font:"'Space Mono',monospace", up:true, w:700, d:19, p:15, tr:"-.02em"},
  "fado":         {bg:"#141210", ink:"#f4efe6", font:"'Abril Fatface',serif", w:400, d:30, p:24, tr:"0"},
  "hip-hop":      {bg:"#f2c230", ink:"#141414", font:"'Bungee',sans-serif", w:400, d:22, p:16, tr:"0"},
  "jazz":         {bg:"#1e4f8f", ink:"#f4efe6", font:"'Josefin Sans',sans-serif", up:true, w:600, d:24, p:18, tr:".18em"},
  "rock":         {bg:"#161616", ink:"#e23b2e", font:"'Anton',sans-serif", up:true, w:400, d:34, p:26, tr:".01em"},
  "soul-and-funk":{bg:"#e8742c", ink:"#3a1d0f", font:"'Shrikhand',cursive", w:400, d:24, p:18, tr:"0"},
};
function artC(g){
  const c = C[g.slug], s = c.ink, id="c"+(uid++);
  switch(g.slug){
    case "classical": return `<rect x="5" y="5" width="90" height="90" rx="9" fill="none" stroke="#b08d4a" stroke-width=".9"/><rect x="7.5" y="7.5" width="85" height="85" rx="7" fill="none" stroke="#b08d4a" stroke-width=".4"/>
      <g fill="none" stroke="#b08d4a" stroke-width=".8"><path d="M50,18 c-6,-6 -14,-2 -10,4 c3,4 9,1 6,-3 M50,18 c6,-6 14,-2 10,4 c-3,4 -9,1 -6,-3"/><path d="M30,18 H40 M60,18 H70"/></g>`;
    case "electronic": return `<defs><pattern id="${id}p" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10,0 V10 H0" fill="none" stroke="#3fd7e8" stroke-width=".3" opacity=".45"/></pattern></defs>
      <rect width="100" height="100" fill="url(#${id}p)"/>
      ${[18,30,12,38,24,44,20,34,10].map((h,i)=>`<rect x="${50+i*5.4}" y="${50-h}" width="3.6" height="${h}" fill="${s}" opacity="${.55+i%3*.2}"/>`).join("")}`;
    case "fado": {
      return `<defs><pattern id="${id}p" width="12.5" height="12.5" patternUnits="userSpaceOnUse"><rect width="12.5" height="12.5" fill="#f4efe6"/>
        <g fill="none" stroke="#2a5ea8" stroke-width=".9"><path d="M6.25,1 L11.5,6.25 L6.25,11.5 L1,6.25 Z"/><circle cx="6.25" cy="6.25" r="1.8" fill="#2a5ea8"/>
        <path d="M0,3 A3,3 0 0 0 3,0 M9.5,0 A3,3 0 0 0 12.5,3 M12.5,9.5 A3,3 0 0 0 9.5,12.5 M3,12.5 A3,3 0 0 0 0,9.5"/></g></pattern></defs>
        <rect width="100" height="25" fill="url(#${id}p)"/><rect y="25" width="100" height="1.5" fill="#2a5ea8"/>`;
    }
    case "hip-hop": {
      let d=""; for(let r=0;r<9;r++)for(let k=0;k<9;k++){const x=56+k*5.5,y=4+r*5.5,dist=Math.hypot(100-x,y);const rad=Math.max(0,2.4-dist/26);if(rad>.2)d+=`<circle cx="${x}" cy="${y}" r="${rad.toFixed(2)}"/>`;}
      return `<g fill="${s}">${d}</g>`;
    }
    case "jazz": return `<circle cx="74" cy="28" r="18" fill="#e9893a"/><rect x="40" y="10" width="7" height="44" fill="#0f1a2c"/><rect x="50" y="22" width="7" height="32" fill="#0f1a2c"/><rect x="60" y="50" width="38" height="4" fill="#f4efe6"/>`;
    case "rock": return `<path d="M58,0 H74 L50,62 H34 Z" fill="#f4efe6" opacity=".92"/><path d="M80,0 H88 L64,62 H56 Z" fill="${s}"/>`;
    case "soul-and-funk": {
      const cols=["#3a1d0f","#f3c14a","#f4efe6","#8a3b16"]; let a=""; cols.forEach((col,i)=>{a+=`<path d="M${30+i*9},0 C${30+i*9},${30+i*4} ${70-i*0},${36+i*9} 100,${36+i*9}" fill="none" stroke="${col}" stroke-width="5"/>`}); return a;
    }
  }
}

function tile(opt, g){
  let bg=g.color, ink=g.ink, art, nameStyle="";
  if(opt==="A") art=artA(g);
  if(opt==="B") art=artB(g);
  if(opt==="B2") art=artB2(g);
  if(opt==="V1") art=artV1(g);
  if(opt==="V2") art=artV2(g);
  if(opt==="V3") art=artV3(g);
  if(opt==="C"){const c=C[g.slug]; bg=c.bg; ink=c.ink; art=artC(g);
    nameStyle=`font-family:${c.font};font-weight:${c.w};font-style:${c.style||"normal"};letter-spacing:${c.tr};${c.up?"text-transform:uppercase;":""}--d:${c.d}px;--p:${c.p}px`;}
  uid++;
  return `<div class="t" style="background:${bg};color:${ink}" aria-label="${g.name}, ${recs(g.n)}">
    <svg class="art" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${art}</svg>
    <span class="lab" style="${opt==="C"&&g.slug==="classical"?"left:11%;bottom:11%":""}"><span class="nm${opt==="C"?" own":""}" style="${nameStyle}">${g.name}</span><span class="ct">${recs(g.n)}</span></span></div>`;
}

const OPTS = [
  {k:"A", title:"Option A · The genre's instrument",
   what:"Today's colours stay. The record in the corner becomes a line drawing of an instrument people link to the genre: violin, drum machine, Portuguese guitar, boombox, saxophone, electric guitar, vintage microphone.",
   t:[["Look","Closest to today and to the Assignment 1 palette; one drawing style for all seven."],["How it reads","Instruments are easy to recognise, even for non-specialists; the drawings are thin, so at phone size they read as shapes more than detail."],["To build","Only Crate.tsx changes (an inline drawing per genre). No new fonts, no new colours."]]},
  {k:"B", title:"Option B · A pattern from the genre's world",
   what:"Today's colours stay. A pattern fills the crate and fades toward the name: music staff, oscilloscope waves, azulejo tiles, brick wall with spray paint, mid-century shapes, lightning bolt, 70s sunset stripes.",
   t:[["Look","More graphic and more varied than today, still inside the warm palette. The record in the corner goes."],["How it reads","Evokes the culture of each genre more than an object. Some patterns need a moment to read (Jazz shapes, Electronic waves); azulejos and stripes read at once."],["To build","Only Crate.tsx changes (an inline pattern per genre). No new fonts, no new colours."]]},
  {k:"V1", title:"B · variation 1 · Fine line",
   what:"Same subjects as B, drawn in one thin, sharp line: thinner notes, a fine spray stroke with long drips, the bolt in outline without speed lines, the jazz circle in outline, the 70s rings alternating thick and thin.",
   t:[["Look","Precise and calm, like an engraving; the furthest from a sticker."],["How it reads","Every subject is still there, so the link to the genre stays; at phone size the thin lines read lighter."],["To build","Only Crate.tsx changes. No new fonts, no new colours."]]},
  {k:"V2", title:"B · variation 2 · Screen print",
   what:"Same subjects as B, as flat solid shapes in two inks printed slightly off register, like a gig poster: notes on a staff, equaliser bars, one large azulejo flower, a cassette tape for Hip-hop, the bolt, the jazz shapes with an amber circle, the 70s stripes.",
   t:[["Look","Bold and crafted; the offset second ink makes it look printed, not drawn on a screen."],["How it reads","The strongest link to the genre and the fastest to read at phone size. Uses brown and amber from the palette as the second ink."],["To build","Only Crate.tsx changes. No new fonts; brown and amber already exist in the palette."]]},
  {k:"V3", title:"B · variation 3 · Big crop",
   what:"One part of each subject, very large and cut by the edge of the crate: two big notes on a staff, one wide sound wave, four azulejos, big bricks with a spray stroke, a large circle, a large bolt, wide 70s rings.",
   t:[["Look","Editorial, like a magazine cover or a record sleeve; scale makes it feel grown-up."],["How it reads","Bold and graphic, but a cropped subject can take a second look (Electronic wave, Jazz circle)."],["To build","Only Crate.tsx changes. No new fonts, no new colours."]]},
  {k:"B2", title:"Option B, sober · Tone on tone, thin lines",
   what:"Same idea as B, without icons: every crate gets a texture in one thin line weight, a little darker or lighter than its own colour: two staves, sound waves, azulejos, brick wall, mid-century shapes in outline, zigzags, 70s rings.",
   t:[["Look","Calmer and more grown-up than B; closer to a printed record sleeve. The seven crates look like one family."],["How it reads","The colour and the name do most of the work; the texture is noticed second. Some genres are harder to tell apart at a glance (Electronic waves, Rock zigzags)."],["To build","Only Crate.tsx changes. No new fonts, no new colours."]]},
  {k:"C", title:"Option C · Each genre with its own colours and lettering",
   what:"Each crate looks like a record sleeve of its genre: its own background, text colour and font (serif italic for Classical, monospace for Electronic, black and azulejo blue for Fado, yellow for Hip-hop, blue and orange for Jazz, black and red for Rock, orange 70s lettering for Soul and funk).",
   t:[["Look","The most expressive and the most representative, but it leaves the warm palette and the one heading font from the visual direction in CLAUDE.md."],["How it reads","Each genre is recognisable before reading the name. The row becomes much louder than the rest of the home page."],["To build","Seven new Google fonts (no new package, but heavier page) and a new colour per genre. Needs a DECISIONS entry."]]},
];

document.getElementById("options").innerHTML = OPTS.map(o=>`
  <section class="frame">
    <h2 class="hd">${o.title}</h2><p class="what">${o.what}</p>
    <div class="trade">${o.t.map(([b,x])=>`<div><b>${b}</b>${x}</div>`).join("")}</div>
    <div class="layout">
      <div><p class="sub">Desktop size · all seven genres</p><div class="grid">${G.map(g=>tile(o.k,g)).join("")}</div><p class="illus">Illustrative data</p></div>
      <div class="phone"><p class="sub">Phone · 375 px · swipe sideways</p><h3 class="hd">Pick a crate</h3><div class="row">${G.map(g=>tile(o.k,g)).join("")}</div><p class="illus">Illustrative data</p></div>
    </div>
  </section>`).join("");

/* Option C: name size per font, desktop vs phone */
const css = document.createElement("style");
css.textContent = `.grid .t .nm.own{font-size:var(--d)} .phone .t .nm.own{font-size:var(--p)}`;

</script>
